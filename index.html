<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="EvoBite: eat, grow and choose your evolution in a fast .io arena."
    />
    <meta name="theme-color" content="#0b1020" />
    <title>EvoBite</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2728%27 fill=%27%2335e0a1%27/%3E%3Ccircle cx=%2724%27 cy=%2726%27 r=%276%27 fill=%27%23fff%27/%3E%3Ccircle cx=%2740%27 cy=%2726%27 r=%276%27 fill=%27%23fff%27/%3E%3Ccircle cx=%2726%27 cy=%2727%27 r=%273%27/%3E%3Ccircle cx=%2742%27 cy=%2727%27 r=%273%27/%3E%3C/svg%3E"
    />
    <!-- CrazyGames SDK. Deferred, not async: deferred scripts run in document order, so the
         game module (also deferred) still finds it loaded, but the page paints while it
         downloads. Off-platform its environment is 'disabled' and the game uses a mock. -->
    <script defer src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      /* Inline so the splash shows before any stylesheet or script arrives. */
      html,
      body {
        margin: 0;
        background: #0b1020;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #fff;
        font:
          900 clamp(40px, 8vw, 72px) system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        letter-spacing: -0.02em;
        z-index: 50;
        transition: opacity 0.25s ease;
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash span {
        color: #35e0a1;
      }
      #splash i {
        display: block;
        width: 2.2em;
        height: 0.22em;
        margin: 0.5em auto 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #35e0a1 0 40%, rgba(255, 255, 255, 0.12) 40%);
        background-size: 250% 100%;
        animation: splash-load 1.1s linear infinite;
      }
      @keyframes splash-load {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -50% 0;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="overlay"></div>
    <div id="splash" aria-hidden="true">
      <div>EVO<span>BITE</span><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
